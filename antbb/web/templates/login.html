{% extends "base.html" %}
{% block title %}{{ t('login.title') }} · antbb{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:2rem auto">
  <p class="lang-switch" aria-label="{{ t('lang.switch') }}">
    <a href="{{ lang_href('de') }}"{% if current_lang() == 'de' %} aria-current="true"{% endif %}>DE</a>
    |
    <a href="{{ lang_href('en') }}"{% if current_lang() == 'en' %} aria-current="true"{% endif %}>EN</a>
  </p>
  <h2>{{ t('login.title') }}</h2>
  {% if error %}<p class="blocked">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label>{{ t('login.user') }}<input name="username" required autofocus></label>
    <label>{{ t('login.password') }}<input name="password" type="password" required></label>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
  <p class="hint">{{ t('login.hint') }}</p>
  <p class="hint">{{ t('legal.not_substitute') }} {{ t('scope.default_deny') }}</p>
</section>
{% endblock %}
