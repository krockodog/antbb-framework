{% extends "base.html" %}
{% block title %}{{ t('twofa.login.title') }} · antbb{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:2rem auto">
  <h2>🔐 {{ t('twofa.login.title') }}</h2>
  {% if error %}<p class="blocked">{{ error }}</p>{% endif %}
  <p class="hint">{{ t('twofa.login.hint') }}</p>
  <form method="post" action="/login/2fa">
    <label>{{ t('twofa.code') }}<input name="code" required autofocus autocomplete="one-time-code" inputmode="text" maxlength="16"></label>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
  <p><a href="/login">← {{ t('login.title') }}</a></p>
</section>
{% endblock %}
